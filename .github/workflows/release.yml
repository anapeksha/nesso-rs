name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    environment: crates.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match workspace version v${version}"
            exit 1
          fi

      - name: Validate
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace
          cargo test -p nesso-input -p nesso-storage --target x86_64-unknown-linux-gnu
          cargo build --workspace --release
          cargo doc --workspace --no-deps

      - name: Publish internal crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          crates=(
            nesso-display
            nesso-audio
            nesso-n1
            nesso-touch
            nesso-input
            nesso-imu
            nesso-power
            nesso-wifi
            nesso-storage
          )

          for crate in "${crates[@]}"; do
            cargo publish -p "${crate}" --token "${CARGO_REGISTRY_TOKEN}"
            sleep 30
          done

      - name: Publish public crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p nesso --token "${CARGO_REGISTRY_TOKEN}"

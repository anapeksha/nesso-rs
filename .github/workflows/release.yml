name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    environment: crates.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match workspace version v${version}"
            exit 1
          fi

      - name: Validate
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace
          cargo test -p nesso-input -p nesso-storage --target x86_64-unknown-linux-gnu
          cargo build --workspace --release
          cargo doc --workspace --no-deps

      - name: Publish internal crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          crates=(
            nesso-display
            nesso-audio
            nesso-n1
            nesso-touch
            nesso-input
            nesso-imu
            nesso-power
            nesso-wifi
            nesso-storage
          )

          publish_crate() {
            local crate="$1"
            local attempts=6

            if curl --silent --fail "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} is already published; skipping"
              return 0
            fi

            for attempt in $(seq 1 "${attempts}"); do
              echo "Publishing ${crate} ${version}, attempt ${attempt}/${attempts}"
              if cargo publish -p "${crate}" --token "${CARGO_REGISTRY_TOKEN}"; then
                sleep 180
                return 0
              fi

              echo "Publish failed for ${crate}; waiting before retry"
              sleep $((attempt * 180))
            done

            echo "Failed to publish ${crate} ${version}"
            return 1
          }

          for crate in "${crates[@]}"; do
            publish_crate "${crate}"
          done

      - name: Publish public crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"

          if curl --silent --fail "https://crates.io/api/v1/crates/nesso/${version}" >/dev/null; then
            echo "nesso ${version} is already published; skipping"
            exit 0
          fi

          for attempt in $(seq 1 6); do
            echo "Publishing nesso ${version}, attempt ${attempt}/6"
            if cargo publish -p nesso --token "${CARGO_REGISTRY_TOKEN}"; then
              exit 0
            fi
            echo "Publish failed for nesso; waiting before retry"
            sleep $((attempt * 180))
          done

          echo "Failed to publish nesso ${version}"
          exit 1

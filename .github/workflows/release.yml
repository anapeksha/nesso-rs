name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Install nightly docs toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match nesso crate version v${version}"
            exit 1
          fi

      - name: Validate
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --target riscv32imac-unknown-none-elf --all-targets -- -D warnings
          cargo xtask lint
          cargo check --workspace --target riscv32imac-unknown-none-elf
          cargo check --workspace --target riscv32imac-unknown-none-elf --all-features
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          RUSTFLAGS="--cfg nesso_host_tests" \
            cargo test --manifest-path tests/host/Cargo.toml --target "${HOST_TARGET}"
          RUSTFLAGS="--cfg nesso_host_tests" \
            cargo clippy --manifest-path tests/host/Cargo.toml \
              --target "${HOST_TARGET}" --all-targets -- -D warnings
          cargo build --workspace --target riscv32imac-unknown-none-elf --release
          cargo +nightly rustdoc -p nesso --lib \
            -Zbuild-std=core,alloc \
            --target riscv32imac-unknown-none-elf \
            --all-features \
            -- -D warnings

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p nesso --target riscv32imac-unknown-none-elf

name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: riscv32imac-unknown-none-elf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify release tag
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Release tag ${tag} does not match workspace version v${version}"
            exit 1
          fi

      - name: Validate
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo check --workspace
          cargo test -p nesso-input -p nesso-storage --target x86_64-unknown-linux-gnu
          cargo build --workspace --release
          cargo doc --workspace --no-deps

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish internal crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          crates=(
            nesso-display
            nesso-audio
            nesso-n1
            nesso-touch
            nesso-input
            nesso-imu
            nesso-power
            nesso-wifi
            nesso-storage
          )

          crate_version() {
            cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$1" '.packages[] | select(.name == $crate) | .version'
          }

          crate_published() {
            local crate="$1"
            local version="$2"
            curl --silent --fail "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null
          }

          for crate in "${crates[@]}"; do
            version="$(crate_version "${crate}")"
            if crate_published "${crate}" "${version}"; then
              echo "Skipping ${crate} ${version}; already published"
              continue
            fi

            echo "Publishing ${crate} ${version}"
            cargo publish -p "${crate}"
          done

      - name: Publish public crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nesso") | .version')"
          if curl --silent --fail "https://crates.io/api/v1/crates/nesso/${version}" >/dev/null; then
            echo "Skipping nesso ${version}; already published"
            exit 0
          fi

          echo "Publishing nesso ${version}"
          cargo publish -p nesso

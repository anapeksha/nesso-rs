[workspace]
resolver = "2"
members = [
    "crates/nesso",
    "examples/hello_world",
    "examples/display_test",
    "examples/display_orientation",
    "examples/dirty_regions",
    "examples/touch_test",
    "examples/input_events",
    "examples/input_test",
    "examples/imu_test",
    "examples/env_pro_test",
    "examples/wifi_scan",
    "examples/wifi_net_stack",
    "examples/board_info",
    "examples/audio_test",
    "examples/queued_audio",
    "examples/battery_test",
    "examples/power_status",
    "examples/storage_test",
    "examples/storage_settings",
    "examples/motion_test",
    "examples/motion_status",
    "examples/ui_test",
    "examples/ble_peripheral",
    "examples/ble_beacon",
    "examples/ble_notifications",
    "examples/ble_notification_mirror",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Nesso RS Contributors"]
repository = "https://github.com/anapeksha/nesso-rs"
homepage = "https://github.com/anapeksha/nesso-rs"
documentation = "https://docs.rs/nesso"
readme = "README.md"
keywords = ["esp32c6", "embedded", "nesso", "arduino", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

[workspace.dependencies]
bmi2 = { version = "0.1.2", default-features = false }
bt-hci = { version = "0.8.1", default-features = false }
embedded-graphics = { version = "0.8.1", default-features = false }
embassy-futures = { version = "0.1.2", default-features = false }
embassy-net = { version = "0.9.1", default-features = false, features = [
    "dhcpv4",
    "medium-ethernet",
    "proto-ipv4",
] }
embassy-sync = { version = "0.7.2", default-features = false }
embassy-time-driver = { version = "0.2.2", default-features = false, features = [
    "tick-hz-1_000_000",
] }
embedded-hal = { version = "1.0.0", default-features = false }
embedded-hal-async = { version = "1.0.0", default-features = false }
esp-alloc = { version = "0.10.0", default-features = true, features = [
    "esp32c6",
] }
esp-backtrace = { version = "0.19.0", default-features = false, features = [
    "esp32c6",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false, features = [
    "esp32c6",
] }
esp-hal = { version = "~1.1.1", default-features = false, features = [
    "esp32c6",
    "rt",
    "unstable",
] }
esp-println = { version = "0.17.0", default-features = false, features = [
    "esp32c6",
    "no-op",
] }
esp-radio = { version = "0.18.0", default-features = false, features = [
    "esp-alloc",
    "esp32c6",
    "unstable",
] }
esp-rtos = { version = "0.3.0", default-features = false, features = [
    "esp-alloc",
    "esp-radio",
    "esp32c6",
] }
heapless = { version = "0.8.0", default-features = false }
nb = "1.1.0"
trouble-host = { version = "0.6.0", default-features = false, features = [
    "default-packet-pool",
    "gatt",
    "peripheral",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nesso_host_tests)'] }

[workspace.lints.clippy]
large_stack_frames = "deny"
mem_forget = "deny"
